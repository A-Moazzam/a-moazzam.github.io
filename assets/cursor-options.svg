<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .bg { fill: #0b0f0f; }
      .panel { fill: #111918; stroke: rgba(83, 224, 184, 0.22); stroke-width: 1; }
      .label { fill: #f7f4ed; font: 700 25px Inter, Arial, sans-serif; }
      .note { fill: rgba(247, 244, 237, 0.58); font: 500 16px Inter, Arial, sans-serif; }
      .teal { stroke: #35d6a2; fill: none; filter: url(#glow); }
      .teal-fill { fill: #35d6a2; filter: url(#glow); }
      .muted { stroke: rgba(247, 244, 237, 0.36); fill: none; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="720"/>
  <text x="60" y="58" class="label" font-size="32">Cursor follower options</text>
  <text x="60" y="86" class="note">The normal cursor would stay visible. These shapes would follow behind it.</text>

  <g transform="translate(50 120)">
    <rect class="panel" width="330" height="230" rx="8"/>
    <text x="26" y="42" class="label">Optical Reticle</text>
    <text x="26" y="68" class="note">Focusing target / crosshair</text>
    <g transform="translate(165 140)" stroke-linecap="round">
      <circle class="teal" r="38" stroke-width="2"/>
      <circle class="muted" r="15" stroke-width="1.5"/>
      <path class="teal" d="M0 -56v32 M0 24v32 M-56 0h32 M24 0h32" stroke-width="3"/>
      <circle class="teal-fill" r="4"/>
    </g>
  </g>

  <g transform="translate(435 120)">
    <rect class="panel" width="330" height="230" rx="8"/>
    <text x="26" y="42" class="label">Aperture Square</text>
    <text x="26" y="68" class="note">Sensor crop / ROI marker</text>
    <g transform="translate(165 140)">
      <rect class="teal" x="-38" y="-38" width="76" height="76" rx="3" stroke-width="3"/>
      <rect class="muted" x="-20" y="-20" width="40" height="40" rx="2" stroke-width="1.5"/>
      <circle class="teal-fill" r="4"/>
    </g>
  </g>

  <g transform="translate(820 120)">
    <rect class="panel" width="330" height="230" rx="8"/>
    <text x="26" y="42" class="label">Scanning Line</text>
    <text x="26" y="68" class="note">Measurement sweep indicator</text>
    <g transform="translate(165 140)" stroke-linecap="round">
      <path class="teal" d="M0 -62v124" stroke-width="4"/>
      <path class="muted" d="M-48 -34h96 M-48 0h96 M-48 34h96" stroke-width="1.3"/>
      <circle class="teal-fill" r="5"/>
    </g>
  </g>

  <g transform="translate(50 400)">
    <rect class="panel" width="330" height="230" rx="8"/>
    <text x="26" y="42" class="label">Focus Box</text>
    <text x="26" y="68" class="note">Autofocus corner brackets</text>
    <g transform="translate(165 140)" stroke-linecap="round">
      <path class="teal" d="M-52 -24v-28h28 M24 -52h28v28 M52 24v28H24 M-24 52h-28V24" stroke-width="4"/>
      <circle class="teal-fill" r="4"/>
    </g>
  </g>

  <g transform="translate(435 400)">
    <rect class="panel" width="330" height="230" rx="8"/>
    <text x="26" y="42" class="label">Waveform Spark</text>
    <text x="26" y="68" class="note">Distortion / signal trace</text>
    <g transform="translate(165 140)" stroke-linecap="round" stroke-linejoin="round">
      <path class="teal" d="M-72 0 C-52 -42 -38 42 -18 0 S20 -42 40 0 S58 34 72 -6" stroke-width="5"/>
      <path class="muted" d="M-82 34h164" stroke-width="1.2"/>
      <circle class="teal-fill" r="4"/>
    </g>
  </g>

  <g transform="translate(820 400)">
    <rect class="panel" width="330" height="230" rx="8"/>
    <text x="26" y="42" class="label">Pixel Cluster</text>
    <text x="26" y="68" class="note">Small sensor-pixel constellation</text>
    <g transform="translate(165 140)">
      <rect class="teal-fill" x="-32" y="-32" width="12" height="12" rx="2"/>
      <rect class="teal-fill" x="-8" y="-40" width="12" height="12" rx="2" opacity="0.72"/>
      <rect class="teal-fill" x="20" y="-20" width="12" height="12" rx="2" opacity="0.86"/>
      <rect class="teal-fill" x="-18" y="8" width="12" height="12" rx="2" opacity="0.6"/>
      <rect class="teal-fill" x="8" y="24" width="12" height="12" rx="2"/>
      <rect class="muted" x="-48" y="-48" width="96" height="96" rx="4" stroke-width="1.2" stroke-dasharray="4 8"/>
    </g>
  </g>
</svg>
